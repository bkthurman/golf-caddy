<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowboys GC - Pro Caddy Field Manual</title>
    <style>
        :root {
            --bg-dark: #10161a;
            --bg-darker: #0a0e11;
            --card-bg: #1e262c;
            --card-bg-2: #232c33;
            --accent-green: #2e7d32;
            --accent-green-2: #43a047;
            --accent-gold: #d4af37;
            --accent-gold-2: #f0d878;
            --text-light: #eceff1;
            --text-dim: #b0bec5;
            --border-color: #2c3840;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: var(--bg-darker);
        }

        body {
            background: radial-gradient(circle at 50% 0%, #17211f 0%, var(--bg-dark) 45%, var(--bg-darker) 100%);
            background-attachment: fixed;
            color: var(--text-light);
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-shell {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #234a29 0%, #14311a 45%, #0d1f12 100%);
            padding: 14px 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #2e5a35;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 200%;
            background: linear-gradient(115deg, rgba(212,175,55,0.10) 0%, rgba(212,175,55,0) 35%);
            pointer-events: none;
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--accent-gold-2), var(--accent-gold) 60%, #a8842a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 2px;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .conditions-bar {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.25));
            margin-top: 8px;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #ffd54f;
            gap: 4px;
        }

        .profile-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 6px;
            padding: 5px 6px;
            border-radius: 6px;
            font-size: 0.68rem;
            color: var(--text-dim);
            gap: 4px 10px;
            border-top: 1px dashed rgba(212,175,55,0.25);
        }

        .info-toggle {
            border: 1px solid rgba(212,175,55,0.4);
            background: rgba(212,175,55,0.08);
            color: var(--accent-gold-2);
            font-size: 0.66rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .club-info-panel {
            background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .club-info-panel h3 {
            color: var(--accent-gold);
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .club-info-cols {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .club-info-cols table {
            flex: 1 1 140px;
            min-width: 140px;
            border-collapse: collapse;
        }

        .club-info-cols caption {
            text-align: left;
            font-size: 0.72rem;
            color: var(--text-dim);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .club-info-cols td {
            font-size: 0.75rem;
            padding: 3px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .club-info-cols td.ci-yd {
            text-align: right;
            color: var(--accent-gold-2);
            font-weight: bold;
        }

        /* Hole scan strip: prev/next + counter for one-handed / driving use */
        .scan-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .scan-btn {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid #3c4d3f;
            background: linear-gradient(160deg, #2e7d32, #1b4d1f);
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
            touch-action: manipulation;
        }

        .scan-btn:active {
            filter: brightness(0.85);
            transform: scale(0.96);
        }

        .hole-counter {
            flex: 1;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .tab-container {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            padding: 4px 0 10px 0;
            margin-bottom: 4px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tab-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background: linear-gradient(160deg, var(--accent-green-2), #1b5e20);
            color: #ffffff;
            border-color: #66bb6a;
            box-shadow: 0 2px 8px rgba(46,125,50,0.5);
        }

        .tab-btn.scorecard-btn {
            background: linear-gradient(160deg, var(--accent-gold-2), #a8842a);
            color: #2a2005;
            border-color: var(--accent-gold);
        }

        .tab-btn.scorecard-btn.active {
            background: linear-gradient(160deg, #ffe082, var(--accent-gold));
            color: #2a2005;
            border-color: var(--accent-gold-2);
            box-shadow: 0 2px 8px rgba(212,175,55,0.5);
        }

        .range-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .range-toggle {
            border: 1px solid var(--border-color);
            background: linear-gradient(160deg, #33424a, #202a2f);
            color: var(--text-dim);
            font-weight: bold;
            font-size: 0.78rem;
            padding: 7px 12px;
            border-radius: 16px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .range-toggle.on {
            background: linear-gradient(160deg, var(--accent-green-2), #1b5e20);
            color: #fff;
            border-color: #66bb6a;
        }

        .range-reading {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-gold-2);
            letter-spacing: 0.3px;
        }

        /* Scorecard */
        .scorecard-card {
            background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .scorecard-card h3 {
            color: var(--accent-gold);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sc-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table.sc-table {
            border-collapse: collapse;
            width: 100%;
            min-width: 620px;
        }

        table.sc-table th, table.sc-table td {
            border: 1px solid var(--border-color);
            text-align: center;
            padding: 5px 4px;
            font-size: 0.78rem;
        }

        table.sc-table th {
            background: rgba(212,175,55,0.12);
            color: var(--accent-gold-2);
            font-weight: bold;
        }

        table.sc-table td.sc-label {
            text-align: left;
            font-weight: bold;
            color: var(--text-dim);
            white-space: nowrap;
        }

        table.sc-table td.sc-total {
            font-weight: bold;
            color: var(--accent-gold-2);
            background: rgba(212,175,55,0.08);
        }

        table.sc-table input.sc-score {
            width: 34px;
            text-align: center;
            background: #0d1215;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        table.sc-table input.sc-score:focus {
            outline: 1px solid var(--accent-gold);
        }

        .sc-diff {
            font-size: 0.7rem;
            display: block;
            margin-top: 1px;
        }

        .sc-diff.under { color: #66bb6a; }
        .sc-diff.over { color: #ef5350; }

        .sc-summary {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sc-summary-item {
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            padding: 8px 14px;
            text-align: center;
        }

        .sc-summary-item .sc-summary-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold-2);
        }

        .sc-summary-item .sc-summary-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .sc-reset {
            display: block;
            margin: 12px auto 0;
            background: linear-gradient(160deg, #c62828, #8e1c1c);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
        }

        .hole-info-header {
            background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-gold);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .hole-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .badge-group {
            display: flex;
            gap: 4px;
        }

        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            color: #fff;
        }

        .badge-white { background: linear-gradient(160deg, #43a047, #2e7d32); }
        .badge-silver { background: linear-gradient(160deg, #b0bec5, #78909c); color: #12181b; }
        .badge-hcp { background: linear-gradient(160deg, #48575f, #37474f); color: #eceff1; }

        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .diagram-card, .strategy-card {
            background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .diagram-card {
            position: relative;
            touch-action: pan-y;
        }

        .diagram-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            object-fit: contain;
            background-color: #151c20;
            min-height: 150px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .hole-photo-wrap {
            position: relative;
            width: 100%;
            line-height: 0;
        }

        .hole-photo {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .live-dot-marker {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2979ff;
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
        }

        .live-dot-marker.on {
            opacity: 1;
            animation: pulseDot 1.6s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.35); }
        }

        .green-dims {
            font-size: 0.72rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 6px;
        }

        .img-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            background-color: #151c20;
            color: var(--text-dim);
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px dashed var(--border-color);
            text-align: center;
            padding: 10px;
        }

        .toggle-container {
            display: flex;
            background: linear-gradient(180deg, #0d1215, #12181b);
            padding: 3px;
            border-radius: 6px;
            margin-bottom: 10px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: none;
            color: var(--text-dim);
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
        }

        .toggle-btn.active {
            background: linear-gradient(160deg, #33424a, #202a2f);
            color: var(--accent-gold-2);
            box-shadow: inset 0 0 0 1px rgba(212,175,55,0.35);
        }

        .section-box {
            margin-bottom: 8px;
            background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid #00897b;
        }

        .section-box.beg {
            border-left-color: #fb8c00;
        }

        .section-box h4 {
            color: var(--accent-gold);
            font-size: 0.8rem;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .section-box p {
            font-size: 0.85rem;
            line-height: 1.35;
            color: #cfd8dc;
        }

        .green-detail {
            background: linear-gradient(160deg, rgba(67,160,71,0.18), rgba(27,94,32,0.10));
            border: 1px dashed #2e7d32;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #a5d6a7;
        }

        footer.hint {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0.6;
            margin: 14px 0 4px;
        }

        /* Tablet / desktop: wider centered shell, side-by-side content */
        @media (min-width: 720px) {
            .app-shell {
                max-width: 900px;
            }

            .content-grid {
                flex-direction: row;
                align-items: flex-start;
            }

            .diagram-card {
                flex: 1 1 50%;
                position: sticky;
                top: 10px;
            }

            .strategy-card {
                flex: 1 1 50%;
            }

            header h1 { font-size: 1.5rem; }
            .hole-title { font-size: 1.35rem; }
        }

        /* Phone in landscape (car mount) — flatten header, go side-by-side sooner */
        @media (max-height: 480px) and (orientation: landscape) {
            header { padding: 6px 10px; margin-bottom: 6px; }
            header p, .conditions-bar { display: none; }
            header h1 { font-size: 1rem; }
            .content-grid { flex-direction: row; }
            .diagram-card { flex: 1 1 45%; }
            .strategy-card { flex: 1 1 55%; }
            .scan-btn { width: 44px; height: 44px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <h1>COWBOYS GC — CADDY GUIDE</h1>
            <p>1600 Fairway Dr, Grapevine, TX 76051</p>
            <div class="conditions-bar">
                <span>🌡️ 77°→90°F</span>
                <span>💨 9-13mph, gusts 24</span>
                <span>🕗 Shotgun 8:00 AM</span>
            </div>
            <div class="profile-bar">
                <span>12 HCP: 260/145, Blue Tee</span>
                <span>Format: 4-Man Scramble</span>
                <button class="info-toggle" id="btnClubInfo" onclick="toggleClubInfo()" aria-label="Show full club distance table">ⓘ Clubs</button>
            </div>
        </header>

        <div class="club-info-panel" id="clubInfoPanel" style="display:none;"></div>

        <div class="scan-bar">
            <button class="scan-btn" id="btnPrev" aria-label="Previous hole" onclick="stepHole(-1)">‹</button>
            <div class="hole-counter" id="holeCounter">HOLE 1 OF 18</div>
            <button class="scan-btn" id="btnNext" aria-label="Next hole" onclick="stepHole(1)">›</button>
        </div>

        <div class="tab-container" id="tabContainer"></div>

        <div id="holeView">
            <div class="hole-info-header" id="holeHeader"></div>

            <div class="range-bar">
                <button class="range-toggle" id="btnRange" onclick="toggleRangefinder()">📍 Rangefinder Off</button>
                <span class="range-reading" id="rangeReading"></span>
            </div>

            <div class="content-grid">
                <div class="diagram-card" id="diagramCard"></div>
                <div class="strategy-card">
                    <div class="toggle-container">
                        <button class="toggle-btn active" id="btnExp" onclick="setGolferType('exp')">Stroke Play</button>
                        <button class="toggle-btn" id="btnBeg" onclick="setGolferType('beg')">Scramble</button>
                    </div>
                    <div id="summaryArea"></div>
                </div>
            </div>

            <footer class="hint">Swipe or use ‹ › to move between holes</footer>
        </div>

        <div id="scorecardView" style="display:none;"></div>
    </div>

        const TOTAL_HOLES = courseData.length;
        const STORAGE_KEY = 'cowboysGcCaddy';
        const SCORES_KEY = 'cowboysGcScores';

        let currentHole = 1;
        let currentGolfer = 'exp';
        let currentView = 'hole';
        let scores = new Array(TOTAL_HOLES).fill(null);
        let rangeOn = false;
        let rangeWatchId = null;
        let lastRangePos = null;

        // Full-bag distances, farthest to shortest, for club-selection suggestions.
        // Provided directly by the user — not extrapolated. Single table since this
        // course only has one golfer profile (format toggle doesn't change your swing).
        const CLUB_TABLES = {
            exp: [
                { club: 'Driver', yards: 260 },
                { club: '3-Wood', yards: 230 },
                { club: 'Hybrid 2', yards: 215 },
                { club: 'Hybrid 4', yards: 202 },
                { club: '4-Iron', yards: 185 },
                { club: '5-Iron', yards: 172 },
                { club: '6-Iron', yards: 158 },
                { club: '7-Iron', yards: 145 },
                { club: '8-Iron', yards: 134 },
                { club: '9-Iron', yards: 123 },
                { club: 'PW', yards: 109 },
                { club: 'GW', yards: 98 },
                { club: 'SW', yards: 78 }
            ]
        };

        function clubTableHTML(profile, label) {
            const rows = CLUB_TABLES[profile].map(e => `<tr><td>${e.club}</td><td class="ci-yd">${e.yards}y</td></tr>`).join('');
            return `<table><caption>${label}</caption>${rows}</table>`;
        }

        function toggleClubInfo() {
            const panel = document.getElementById('clubInfoPanel');
            const isOpen = panel.style.display !== 'none';
            if (isOpen) {
                panel.style.display = 'none';
                return;
            }
            panel.innerHTML = `
                <h3>Club Distances</h3>
                <div class="club-info-cols">
                    ${clubTableHTML('exp', '12 HCP')}
                </div>`;
            panel.style.display = '';
        }

        function nearestClub(yards, profile) {
            const table = CLUB_TABLES.exp;
            return table.reduce((best, entry) =>
                Math.abs(entry.yards - yards) < Math.abs(best.yards - yards) ? entry : best
            ).club;
        }

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (saved) {
                    if (saved.hole >= 1 && saved.hole <= TOTAL_HOLES) currentHole = saved.hole;
                    if (saved.golfer === 'exp' || saved.golfer === 'beg') currentGolfer = saved.golfer;
                }
            } catch (e) { /* ignore corrupt/missing state */ }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ hole: currentHole, golfer: currentGolfer }));
            } catch (e) { /* storage unavailable (private mode, etc.) — non-fatal */ }
        }

        function loadScores() {
            try {
                const saved = JSON.parse(localStorage.getItem(SCORES_KEY));
                if (Array.isArray(saved) && saved.length === TOTAL_HOLES) scores = saved;
            } catch (e) { /* ignore corrupt/missing scores */ }
        }

        function saveScores() {
            try {
                localStorage.setItem(SCORES_KEY, JSON.stringify(scores));
            } catch (e) { /* storage unavailable — non-fatal */ }
        }

        function initTabs() {
            const container = document.getElementById('tabContainer');
            container.innerHTML = '';

            const scBtn = document.createElement('button');
            scBtn.className = `tab-btn scorecard-btn ${currentView === 'scorecard' ? 'active' : ''}`;
            scBtn.innerText = '📋 Scorecard';
            scBtn.id = 'scorecardTabBtn';
            scBtn.onclick = () => showScorecardView();
            container.appendChild(scBtn);

            for (let i = 1; i <= TOTAL_HOLES; i++) {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${currentView === 'hole' && i === currentHole ? 'active' : ''}`;
                btn.innerText = `Hole ${i}`;
                btn.onclick = () => showHoleView(i);
                container.appendChild(btn);
            }
        }

        function stepHole(delta) {
            if (currentView !== 'hole') return;
            let next = currentHole + delta;
            if (next < 1) next = TOTAL_HOLES;
            if (next > TOTAL_HOLES) next = 1;
            selectHole(next);
        }

        function showHoleView(num) {
            currentView = 'hole';
            document.getElementById('holeView').style.display = '';
            document.getElementById('scorecardView').style.display = 'none';
            selectHole(num);
        }

        function showScorecardView() {
            currentView = 'scorecard';
            if (rangeOn) toggleRangefinder();
            document.getElementById('holeView').style.display = 'none';
            document.getElementById('scorecardView').style.display = '';
            initTabs();
            renderScorecard();
        }

        function selectHole(num) {
            currentHole = num;
            const d = courseData[num - 1];

            initTabs();
            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

            if (rangeOn) updateRangeReading();

            document.getElementById('holeCounter').innerText = `HOLE ${num} OF ${TOTAL_HOLES}`;

            document.getElementById('holeHeader').innerHTML = `
                <div class="hole-title">Hole ${d.hole} (Par ${d.par})</div>
                <div class="badge-group">
                    <span class="badge badge-white">🔵 ${d.blue}y</span>
                    <span class="badge badge-hcp">HCP ${d.hcp}</span>
                </div>`;

            const diagramCard = document.getElementById('diagramCard');
            const src = IMAGES[d.hole];
            const cal = COWBOYS_IMG_CALIB[d.hole];
            if (src) {
                diagramCard.innerHTML = `
                    <div class="hole-photo-wrap">
                        <img src="${src}" alt="Hole ${d.hole} map" class="hole-photo">
                        <div class="live-dot-marker" id="liveDot${d.hole}"></div>
                    </div>
                    ${cal ? `<div class="green-dims">🟢 Green: ${cal.depth}y deep × ${cal.width}y wide</div>` : ''}`;
            } else {
                diagramCard.innerHTML = `<div class="img-fallback">📷 Map unavailable for Hole ${d.hole}.</div>`;
            }
            if (rangeOn) updateMapDot(lastRangePos);

            renderSummary();
            saveState();
        }

        function setGolferType(type) {
            currentGolfer = type;
            document.getElementById('btnExp').classList.toggle('active', type === 'exp');
            document.getElementById('btnBeg').classList.toggle('active', type === 'beg');
            renderSummary();
            if (rangeOn) updateRangeReading();
            saveState();
        }

        function renderSummary() {
            const d = courseData[currentHole - 1];
            const area = document.getElementById('summaryArea');
            if (currentGolfer === 'exp') {
                area.innerHTML = `
                    <div class="section-box"><h4>🎯 Tee Strategy</h4><p>${d.exp.tee}</p></div>
                    <div class="section-box"><h4>⛳ Approach</h4><p>${d.exp.approach}</p></div>
                    <div class="section-box"><h4>🛡️ Safe Miss</h4><p>${d.exp.miss}</p></div>
                    <div class="green-detail"><strong>🚩 Green:</strong> ${d.exp.green}</div>`;
            } else {
                area.innerHTML = `
                    <div class="section-box beg"><h4>🎲 Team Tee Shot</h4><p>${d.beg.tee}</p></div>
                    <div class="section-box beg"><h4>⛳ Team Approach</h4><p>${d.beg.approach}</p></div>
                    <div class="section-box beg"><h4>🛡️ Risk Management</h4><p>${d.beg.miss}</p></div>
                    <div class="green-detail"><strong>🚩 Green (Team):</strong> ${d.beg.green}</div>`;
            }
        }

        function haversineYards(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
            const dPhi = (lat2 - lat1) * Math.PI / 180;
            const dLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dPhi / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dLambda / 2) ** 2;
            const meters = 2 * R * Math.asin(Math.sqrt(a));
            return meters * 1.09361;
        }

        function updateRangeReading(pos) {
            const reading = document.getElementById('rangeReading');
            if (!reading) return;
            if (pos) lastRangePos = pos;
            const usePos = pos || lastRangePos;
            const green = COWBOYS_GREENS[currentHole];
            if (!usePos || !green) return;
            const yd = haversineYards(usePos.coords.latitude, usePos.coords.longitude, green.lat, green.lon);
            const club = nearestClub(yd, currentGolfer);
            reading.innerText = `${Math.round(yd)} yds to green · ${club} suggested`;
            updateMapDot(usePos);
        }

        // Projects live GPS onto the hole's map IMAGE using a per-hole 2-point
        // (tee + green) similarity transform — see COWBOYS_IMG_CALIB — so the dot
        // lands on the real drawn fairway, not just a generic schematic.
        function updateMapDot(pos) {
            if (!pos) return;
            const p = COWBOYS_IMG_CALIB[currentHole];
            const dot = document.getElementById(`liveDot${currentHole}`);
            if (!p || !dot) return;
            const xm = (pos.coords.longitude - p.originLon) * p.mLon;
            const ym = (pos.coords.latitude - p.originLat) * p.mLat;
            // complex multiply (kRe + kIm*i) * (xm + (-ym)*i), then translate
            const px = p.kRe * xm - p.kIm * (-ym) + p.tRe;
            const py = p.kRe * (-ym) + p.kIm * xm + p.tIm;
            dot.style.left = ((px / p.boxW) * 100).toFixed(2) + '%';
            dot.style.top = ((py / p.boxH) * 100).toFixed(2) + '%';
            dot.classList.add('on');
        }

        function toggleRangefinder() {
            const btn = document.getElementById('btnRange');
            const reading = document.getElementById('rangeReading');
            if (!rangeOn) {
                if (!('geolocation' in navigator)) {
                    reading.innerText = 'GPS not available on this device/browser.';
                    return;
                }
                rangeWatchId = navigator.geolocation.watchPosition(
                    (pos) => { updateRangeReading(pos); },
                    (err) => {
                        reading.innerText = err.code === err.PERMISSION_DENIED
                            ? 'Location permission denied.'
                            : 'Unable to get location.';
                    },
                    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
                );
                rangeOn = true;
                btn.classList.add('on');
                btn.innerText = '📍 Rangefinder On';
                reading.innerText = 'Locating…';
            } else {
                if (rangeWatchId !== null) navigator.geolocation.clearWatch(rangeWatchId);
                rangeWatchId = null;
                rangeOn = false;
                btn.classList.remove('on');
                btn.innerText = '📍 Rangefinder Off';
                reading.innerText = '';
                const dot = document.getElementById(`liveDot${currentHole}`);
                if (dot) dot.classList.remove('on');
            }
        }

        function updateScore(holeIdx, value) {
            const n = parseInt(value, 10);
            scores[holeIdx] = (isNaN(n) || n <= 0) ? null : n;
            saveScores();
            refreshScorecardTotals(holeIdx);
        }

        // Patches totals/diff labels in place rather than re-rendering the table,
        // so score <input> elements are never recreated and keyboard tab order survives.
        function refreshScorecardTotals(holeIdx) {
            const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };

            const diffEl = document.getElementById(`sc-diff-${holeIdx}`);
            if (diffEl) {
                const s = scores[holeIdx];
                const diff = s == null ? 0 : s - courseData[holeIdx].par;
                diffEl.className = `sc-diff ${diff < 0 ? 'under' : diff > 0 ? 'over' : ''}`;
                diffEl.textContent = diff === 0 ? '' : (diff > 0 ? `+${diff}` : `${diff}`);
            }

            const out = sumRange(0, 9);
            const inn = sumRange(9, 18);
            const tot = (out != null && inn != null) ? out + inn : null;
            const parTotal = courseData.reduce((a, d) => a + d.par, 0);
            const toPar = tot == null ? null : tot - parTotal;

            setText('sc-front-total', out == null ? '—' : out);
            setText('sc-back-total', inn == null ? '—' : inn);
            setText('sc-val-out', out == null ? '—' : out);
            setText('sc-val-in', inn == null ? '—' : inn);
            setText('sc-val-tot', tot == null ? '—' : tot);
            setText('sc-val-topar', toPar == null ? '—' : (toPar > 0 ? '+' + toPar : toPar));
        }

        function resetScores() {
            if (!confirm('Clear all scores for this round?')) return;
            scores = new Array(TOTAL_HOLES).fill(null);
            saveScores();
            renderScorecard();
        }

        function sumRange(start, end) {
            let sum = 0, hasAny = false;
            for (let i = start; i < end; i++) {
                if (scores[i] != null) { sum += scores[i]; hasAny = true; }
            }
            return hasAny ? sum : null;
        }

        function scoreDiffLabel(holeIdx) {
            const s = scores[holeIdx];
            const diff = s == null ? 0 : s - courseData[holeIdx].par;
            const cls = diff < 0 ? 'under' : diff > 0 ? 'over' : '';
            const label = diff === 0 ? '' : (diff > 0 ? `+${diff}` : `${diff}`);
            return `<span class="sc-diff ${cls}" id="sc-diff-${holeIdx}">${label}</span>`;
        }

        function renderNineTable(startIdx, endIdx, title) {
            let holeCells = '', parCells = '', hcpCells = '', scoreCells = '';
            for (let i = startIdx; i < endIdx; i++) {
                const d = courseData[i];
                holeCells += `<th>${d.hole}</th>`;
                parCells += `<td>${d.par}</td>`;
                hcpCells += `<td>${d.hcp}</td>`;
                const val = scores[i] == null ? '' : scores[i];
                scoreCells += `<td><input class="sc-score" type="number" min="1" max="15" inputmode="numeric" value="${val}" onchange="updateScore(${i}, this.value)">${scoreDiffLabel(i)}</td>`;
            }
            const total = sumRange(startIdx, endIdx);
            const parTotal = courseData.slice(startIdx, endIdx).reduce((a, d) => a + d.par, 0);
            const totalId = title === 'Front 9' ? 'sc-front-total' : 'sc-back-total';
            return `
                <div class="scorecard-card">
                    <h3>${title} (Par ${parTotal})</h3>
                    <div class="sc-table-wrap">
                        <table class="sc-table">
                            <tr><td class="sc-label">Hole</td>${holeCells}<td class="sc-total">${title === 'Front 9' ? 'Out' : 'In'}</td></tr>
                            <tr><td class="sc-label">Par</td>${parCells}<td class="sc-total">${parTotal}</td></tr>
                            <tr><td class="sc-label">Hcp</td>${hcpCells}<td class="sc-total">—</td></tr>
                            <tr><td class="sc-label">Score</td>${scoreCells}<td class="sc-total" id="${totalId}">${total == null ? '—' : total}</td></tr>
                        </table>
                    </div>
                </div>`;
        }

        function renderScorecard() {
            const view = document.getElementById('scorecardView');
            const out = sumRange(0, 9);
            const inn = sumRange(9, 18);
            const tot = (out != null && inn != null) ? out + inn : null;
            const parTotal = courseData.reduce((a, d) => a + d.par, 0);
            const toPar = tot == null ? null : tot - parTotal;
            view.innerHTML = `
                ${renderNineTable(0, 9, 'Front 9')}
                ${renderNineTable(9, 18, 'Back 9')}
                <div class="scorecard-card">
                    <div class="sc-summary">
                        <div class="sc-summary-item"><div class="sc-summary-value" id="sc-val-out">${out == null ? '—' : out}</div><div class="sc-summary-label">Out</div></div>
                        <div class="sc-summary-item"><div class="sc-summary-value" id="sc-val-in">${inn == null ? '—' : inn}</div><div class="sc-summary-label">In</div></div>
                        <div class="sc-summary-item"><div class="sc-summary-value" id="sc-val-tot">${tot == null ? '—' : tot}</div><div class="sc-summary-label">Total</div></div>
                        <div class="sc-summary-item"><div class="sc-summary-value" id="sc-val-topar">${toPar == null ? '—' : (toPar > 0 ? '+' + toPar : toPar)}</div><div class="sc-summary-label">To Par</div></div>
                    </div>
                    <button class="sc-reset" onclick="resetScores()">Reset Round</button>
                </div>`;
        }

        function initSwipe() {
            const zone = document.querySelector('.content-grid');
            let startX = 0, startY = 0, tracking = false;

            zone.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            zone.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    stepHole(dx < 0 ? 1 : -1);
                }
            }, { passive: true });
        }

        function initKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') stepHole(1);
                if (e.key === 'ArrowLeft') stepHole(-1);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            loadScores();
            selectHole(currentHole);
            setGolferType(currentGolfer);
            initSwipe();
            initKeyboard();
        });
    </script>
</body>
</html>
